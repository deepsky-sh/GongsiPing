plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ───────────────────────────────────────────────────────────────
// AdMob 설정 (실제 계정 값)
//   appId  : AdMob → 앱 → 공시핑 → 앱 설정 → 앱 ID
//   banner : AdMob → 광고 단위 → '하단 배너'
// ※ 내 폰에서는 내 광고를 누르지 말 것 (계정 정지 사유).
//   테스트 광고로 확인하고 싶으면 banner 를 'ca-app-pub-3940256099942544/9214589741' 로 잠시 바꾸면 됨.
// ───────────────────────────────────────────────────────────────
def ADMOB = [
    appId : 'ca-app-pub-2298628087196060~2410731758',
    banner: 'ca-app-pub-2298628087196060/2237799378',
]

android {
    namespace 'kr.home.gongsiping'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jsh.gongsiping'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.4'

        manifestPlaceholders = [admobAppId: ADMOB.appId]
        buildConfigField 'String', 'ADMOB_BANNER', "\"${ADMOB.banner}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.05.01')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    // 광고
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
}
